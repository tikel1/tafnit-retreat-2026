name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-gemini-proxy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install --prefix worker --no-audit --no-fund

      - name: Deploy Gemini proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Cloudflare/Gemini secrets not configured — skipping worker deploy."
            exit 0
          fi
          echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          npx wrangler deploy
        working-directory: worker

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        # We use `npm install` rather than `npm ci` because the lock file is
        # generated on Windows and CI runs on Linux — Linux needs the
        # @emnapi/* optional native deps that Windows doesn't record.
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Preferred: Cloudflare proxy (key stays on the worker).
          # https://tafnit-gemini-proxy.<account>.workers.dev/gemini
          VITE_GEMINI_PROXY_URL: ${{ vars.VITE_GEMINI_PROXY_URL }}
          # Fallback when proxy is not configured yet — bakes the key into
          # the bundle (same as tuscany-2026). Restrict by HTTP referrer in
          # Google AI Studio: https://tikel1.github.io/*
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Verify no API key in bundle
        if: vars.VITE_GEMINI_PROXY_URL != ''
        run: |
          if grep -rE 'AIzaSy[A-Za-z0-9_-]{20,}' dist/assets/*.js; then
            echo 'Gemini API key found in production bundle — aborting.'
            exit 1
          fi
          echo 'OK: no client API key in bundle.'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

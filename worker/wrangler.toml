name = "tafnit-gemini-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Comma-separated browser origins allowed to call this proxy.
[vars]
ALLOWED_ORIGINS = "https://tikel1.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Set GEMINI_API_KEY via:
#   wrangler secret put GEMINI_API_KEY
# or GitHub Actions (see .github/workflows/deploy.yml)
